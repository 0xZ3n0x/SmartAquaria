# SmartAquaria — Terminal Display + Sensor Mock
# Sensors run as virtual UARTs (mock). Display uses terminal (no hardware).
# Actuators use gpio-sim if available, otherwise disabled.

[display]
type = "terminal"

[mock]
sensor   = true
actuator = false

[serial]
baudrate = 115200
timeout  = 1.0

[serial.ports.temp]
mock = "/tmp/vport0"
main = "/tmp/vport1"

[serial.ports.do]
mock = "/tmp/vport2"
main = "/tmp/vport3"

[log]
main     = "log/main.log"
sensor   = "log/sensor.log"
actuator = "log/actuator.log"

[gpio]
chip = "/dev/gpiochip2"

[gpio.buzzer]
line = 0

[gpio.heater]
line = 1

[thresholds.temp]
min         = 20
max         = 30
critical_lo = 16
critical_hi = 34

[thresholds.do]
warning  = 6.0
critical = 5.0

[intervals]
sampling_seconds = 0.2
feeding_seconds  = 28800
